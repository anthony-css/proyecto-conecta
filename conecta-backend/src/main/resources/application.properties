spring.application.name=conecta-backend
server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.jackson.time-zone=America/Lima
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

spring.servlet.multipart.enabled=false
app.asistencia.validar-solo-dia-evento=${ASISTENCIA_VALIDAR_SOLO_DIA_EVENTO:false}